version : '3.8'
services:
  staitech-nacos:
    container_name: staitech-nacos
    image: nacos/nacos-server
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - staitech-mysql
  staitech-mysql:
    container_name: staitech-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: password
  staitech-redis:
    container_name: staitech-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/staitech/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/staitech/redis/redis.conf
  staitech-nginx:
    container_name: staitech-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/staitech/projects/staitech-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - staitech-gateway
    links:
      - staitech-gateway
  staitech-gateway:
    container_name: staitech-gateway
    build:
      context: ./staitech/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - staitech-redis
    links:
      - staitech-redis
  staitech-auth:
    container_name: staitech-auth
    build:
      context: ./staitech/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - staitech-redis
    links:
      - staitech-redis
  staitech-modules-system:
    container_name: staitech-modules-system
    build:
      context: ./staitech/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - staitech-redis
      - staitech-mysql
    links:
      - staitech-redis
      - staitech-mysql
  staitech-modules-gen:
    container_name: staitech-modules-gen
    build:
      context: ./staitech/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - staitech-mysql
    links:
      - staitech-mysql
  staitech-modules-job:
    container_name: staitech-modules-job
    build:
      context: ./staitech/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - staitech-mysql
    links:
      - staitech-mysql
  staitech-modules-file:
    container_name: staitech-modules-file
    build:
      context: ./staitech/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./staitech/uploadPath:/home/staitech/uploadPath
  staitech-visual-monitor:
    container_name: staitech-visual-monitor
    build:
      context: ./staitech/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
